  <ns0:text xml:space="preserve" style="font-stretch:condensed;font-size:1.25217px;font-family:Impact;-inkscape-font-specification:'Impact Condensed';text-align:start;text-anchor:start;fill:#ff0000;stroke:#000000;stroke-width:5.72866;stroke-linecap:round;opacity:0;fill-opacity:0;stroke-opacity:0" x="118" y="1.9579086" id="text1204"><ns0:tspan ns2:role="line" id="tspan1202" x="118" y="1.9579086" style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:1.25217px;font-family:'Noto Sans';-inkscape-font-specification:'Noto Sans';text-align:start;text-anchor:start;fill:#000000;stroke:none;stroke-width:5.72866">The corners of the mask are 1px  smaller because they</ns0:tspan><ns0:tspan ns2:role="line" x="118" y="3.6373279" style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:1.25217px;font-family:'Noto Sans';-inkscape-font-specification:'Noto Sans';text-align:start;text-anchor:start;fill:#000000;stroke:none;stroke-width:5.72866" id="tspan1358">are not antialiased, whereas the svg corners are; if the</ns0:tspan><ns0:tspan ns2:role="line" x="118" y="5.3167472" style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:1.25217px;font-family:'Noto Sans';-inkscape-font-specification:'Noto Sans';text-align:start;text-anchor:start;fill:#000000;stroke:none;stroke-width:5.72866" id="tspan1360">mask is the same size of the svg, then, some of the corner</ns0:tspan><ns0:tspan ns2:role="line" x="118" y="6.9961662" style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:1.25217px;font-family:'Noto Sans';-inkscape-font-specification:'Noto Sans';text-align:start;text-anchor:start;fill:#000000;stroke:none;stroke-width:5.72866" id="tspan1362">pixels of the mask will be visible even though they should</ns0:tspan><ns0:tspan ns2:role="line" x="118" y="8.6755848" style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:1.25217px;font-family:'Noto Sans';-inkscape-font-specification:'Noto Sans';text-align:start;text-anchor:start;fill:#000000;stroke:none;stroke-width:5.72866" id="tspan1364">be covered by the svg.</ns0:tspan></ns0:text>
</ns0:svg>