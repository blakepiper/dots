# Gentoo layout matching the reference screenshot.
print_info() {
    info title
    info underline
    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "Terminal" term
    info "CPU" cpu
    info "Memory" memory
    info cols
}

image_backend="ascii"
ascii_distro="Gentoo"
ascii_colors=(5 7)
colors=(5 7 7 5 7 7)
bold="on"
underline_enabled="on"
separator=":"
color_blocks="on"
block_range=(0 15)
block_width=3
block_height=1
gap=3
kernel_shorthand="on"
distro_shorthand="off"
os_arch="on"
uptime_shorthand="off"
shell_path="off"
shell_version="on"
memory_percent="off"
memory_unit="mib"
cpu_brand="on"
cpu_temp="off"
cpu_cores="logical"
cpu_speed="on"
cpu_shorthand="off"
